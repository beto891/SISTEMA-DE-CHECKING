services:
  - type: web
    name: sistema-checking
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py main:app
    autoDeploy: true
    healthCheckPath: /login
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-checking-db
          property: connectionString

databases:
  - name: sistema-checking-db
    databaseName: sistema_checking
    user: sistema_checking