<!-- Kanban Board -->
<div class="kanban-board">
    <div class="column" id="coluna-solicitacoes">
        <div class="scroll-area">
            <div class="column-header1">
                <h5>Solicitações <span id="count-solicitacoes">0</span><button class="add-task-button">+</button></h5>
                <hr>
            </div>
            <div id="solicitacoes" class="space-y-4">
            <!-- Cards adicionado aqui -->
        </div>
    </div>
</div>
<!-- Coluna Agendado -->
    <div class="column" id="coluna-agendado">
        <div class="scroll-area">
            <div class="column-header2">
                <h5>Agendado <span id="count-agendado">0</span></h5>
                <hr>
            </div>
            <div id="agendado" class="space-y-4">
                <!-- Cards aqui -->
            </div>
        </div>

<!-- Coluna Concluído -->

<!-- Coluna Cancelado -->

                <!-- Cards adicionados aqui -->

<!-- Formulário Global (Para Adicionar Tarefas) -->
<div id="form-container" class="form-container container row col-md-5 mx-auto">
    <div class="form-content">
        <span class="close-button">&times;</span>
        <div class="column-header5">
            <h4><b>Adicionar Tarefa</b></h4>
        </div>
        <hr>
        <form id="task-form" class="form-check">
            <label for="task-name" class="form-label"><b>* O estabelecimento é:</b></label>
            <br>
            <input class="form-check-input" type="radio" id="academia" name="local" value="Academia" required>
            <label for="academia">Acadêmia</label>
            <br>
            <input class="form-check-input bg-dark" type="radio" id="barberia" name="local" value="Barbearia" required>
            <label for="barbearia">Barbearia</label>
            <br>
            <input class="form-check-input" type="radio" id="salao" name="local" value="Salão" required>
            <label for="salao">Salão</label>
            <br>
            <hr>
            <label for="taskReason" class="form-label"><b>* Qual o motivo do chamado:</b></label>
            <br>
            <input class="form-check-input" type="radio" id="manutencao" name="tarefa" value="Manutenção" required>
            <label for="manutencao">Manutenção</label>
            <br>
            <input class="form-check-input" type="radio" id="instalacao" name="tarefa" value="Instalação" required>
            <label for="instalacao">Instalação</label>
            <br>
            <input class="form-check-input" type="radio" id="checkin" name="tarefa" value="Check-in" required>
            <label for="checkin">Check-in fotográfico</label>
            <br>
            <hr>
            <label for="task-details" class="form-label"><b>* Dados do estabelecimento:</b></label>
            <input type="text" id="identificador" class="form-control mt-3" name="identificador" placeholder="Nome do estabelecimento..." required>
            <hr>
            <label for="task-details" class="form-label"><b>Sigla interna:</b></label>
            <textarea name="" class="form-control mt-2" rows="1" id=""></textarea>
            <label for="text" class="form-label"><b>* Endereço do estabelecimento:</b></label>
            <input type="text" name="rua" class="form-control mt-3" placeholder="Rua" required>
            <input type="text" name="bairro" class="form-control" placeholder="Bairro" required>
            <div class="form-group">
                <input id="cidade" name="cidade" type="text" class="form-control" placeholder="Cidade" required>
                <select id="inputState" class="form-control mt-3" required>
                    <option selected disabled>Estado...</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </div>
            <br>
            <label for="descricao" class="form-label"><b>* Descrição do chamado:</b></label>
            <textarea class="form-control mt-3" id="task-details" name="descricao" rows="2" required></textarea>
            <br>
            <div class="d-grid gap-2 mx-auto">
                <button type="submit" class="btn btn-dark w-100" style="border-radius: 20px;">Adicionar Tarefa</button>
            </div>
        </form>
    </div>
</div>

<!-- Formulário de detalhes do chamado -->
<div id="card-form-container">
    <div class="card-form-content form-label">
        <span class="close-card-form">&times;</span>
            <h4><b>Informações adicionais do chamado</b></h4>
        <form id="card-form-agendado">
            <label for="infoAdicional" class="mt-3"><b>* Nome do técnico Solicitado: </b></label>
            <input class="form-control mt-2" type="text" name="infoAdicional" id="infoAdicional" placeholder="Nome do técnico..." required>
            <label for="cpf" class="form-label"><b>* CPF do técnico solicitado:</b></label>
            <input class="form-control mt-2" type="text" name="cpf" id="cpf" placeholder="000.000.000-00" required>
            <label for="dataAgendamento">Data de agendamento:</label>
            <input class="form-control mt-2" type="date" name="dataAgendamento" id="dataAgendamento" required>
            <label for="status">Status:</label>
            <select class="form-control mt-2 " name="status" id="status-agendado" required>
                <option value="agendado" class="bg-dark">Agendado</option>
            </select>
            <div class="d-grid gap-2 mx-auto">
                <button type="submit" class="btn btn-dark w-100 mt-5" style="border-radius: 20px;" onsubmit="addTask(event)">Salvar</button>
            </div>   
        </form>
    </div>
</div>

<!-- Formulário após agendamento para concluir chamado-->

<div id="card-form-concluido">
    <div class="card-form-content form-label">
            <h4>Deseja concluir o chamado?</h4><span class="close-button">&times;</span>
            <br>
        <form id="card-form-concluido1">
            <label for="dataAgendamento">Data de conclusão:</label>
            <input class="form-control mt-2" type="date" name="dataConclusao" id="dataConclusao" required>
            <label for="status">Status:</label>
            <select class="form-control mt-2 " name="status" id="status-concluido" required>
                <option value="concluido">Concluído</option>
                <option value="cancelado">Cancelado</option>
            </select>
            <div class="d-grid gap-2 mx-auto">
                <button type="submit" class="btn btn-dark w-100 mt-5" style="border-radius: 20px;" onsubmit="addTask(event)">Salvar</button>
            </div>   
        </form>
    </div>
</div>

<!-- Modal de confirmação de logout -->
    <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="logoutModalLabel">Confirmação de Logout</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
            <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body">
            Tem certeza que deseja sair?
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-dark" data-dismiss="modal">Cancelar</button>
            <a id="confirmLogout" class="btn btn-danger" href="{{ url_for('auth.logout') }}">Sair</a>
        </div>
        </div>
    </div>
    </div>
