<div class="container-01">
    <div class="filtros form-group">
        <div class="filtro">
            <label for="status"><b>Status:</b></label>
            <select id="status" class="form-control">
                <option value="todos">Todos</option>
                <option value="aberto">Abertos</option>
                <option value="fechado">Fechados</option>
            </select>
        </div>
        <div class="filtro">
            <label for="data-inicio"><b>Data de Início:</b></label>
            <input type="date" class="form-control" id="data-inicio">
        </div>
        <div class="filtro">
            <label for="data-fim"><b>Data de Fim:</b></label>
            <input type="date" class="form-control " id="data-fim">
        </div>
        <div class="exportar">
            <a href=""><img src="{{ url_for("static", filename="img/file_download_24dp_000000.svg")}}" alt=""><b>Exportar</b></a>
        </div>
    </div>
    <div class="marcador">
        <b><span id="num-registros"></span> Registros encontrados...</b>
    </div>

<!-- Modal de confirmação de logout -->
<div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
<div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
    <div class="modal-header">
        <h5 class="modal-title" id="logoutModalLabel">Confirmação de Logout</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
        <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        Tem certeza que deseja sair?
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-dark" data-dismiss="modal">Cancelar</button>
        <a id="confirmLogout" class="btn btn-danger" href="{{ url_for('auth.logout') }}">Sair</a>
    </div>
    </div>
</div>
